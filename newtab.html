<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Streak Reminders</title>
    <link rel="stylesheet" href="newtab.css">
  </head>
  <body>
    <header class="page-header">
      <div class="header-main">
        <h1>Streak Reminders</h1>
        <p class="subtitle">Keep your streaks alive with lightweight New Tab nudges.</p>
        <section class="streak-summary" aria-live="polite">
          <article class="streak-pill">
            <span class="streak-label">Today</span>
            <strong id="todayProgressValue" class="streak-value">0/0</strong>
          </article>
          <article class="streak-pill">
            <span class="streak-label">Current streak</span>
            <strong id="currentStreakValue" class="streak-value">0</strong>
          </article>
          <article class="streak-pill">
            <span class="streak-label">Best streak</span>
            <strong id="bestStreakValue" class="streak-value">0</strong>
          </article>
          <article id="todayStatusBadge" class="streak-pill streak-status" data-status="neutral">
            <span class="streak-label">Status</span>
            <strong id="todayStatusValue" class="streak-value">Neutral day</strong>
          </article>
        </section>
      </div>
      <button id="manageButton" class="ghost-btn" type="button">Manage reminders</button>
    </header>

    <main class="content" id="appRoot">
      <section id="errorBanner" class="banner banner-error hidden" role="alert"></section>
      <section id="infoBanner" class="banner banner-info hidden" role="status"></section>
      <section id="undoBanner" class="banner banner-info hidden" role="status">
        <span id="undoText"></span>
        <button id="undoButton" class="secondary-btn" type="button">Undo</button>
      </section>

      <section id="primarySection" class="hidden">
        <h2 class="section-title">Top priority</h2>
        <div id="primaryContainer"></div>
      </section>

      <section id="secondarySection" class="hidden">
        <h2 class="section-title">Up next</h2>
        <div id="secondaryContainer" class="secondary-list"></div>
      </section>

      <section id="noDueSection" class="hidden">
        <div class="empty-state">All streaks done today ✅</div>
        <div id="allStatusContainer" class="status-list"></div>
      </section>
    </main>

    <script src="progress.js" defer></script>
    <script src="newtab.js" defer></script>
  </body>
</html>
